# AppNet 应用配置文件 - OncoHarmony (European Server)
# 用于定义所有反向代理的应用

# ============================================
# 全局配置
# ============================================
global:
  # 欧洲服务器不需要国内镜像
  github_proxy: ""
  pip_mirror: ""

# Caddy 全局配置
caddy:
  http_port: 80
  https_port: 443
  auto_https: true
  domain: zhoulab.ac.cn

# Landing Page - 跳转到 OncoHarmony 联合团队页面
landing:
  enabled: true
  redirect: https://oncoharmony-network.github.io/

# 应用列表
apps:
  # Demo1 - 前后端分离示例（基因表达分析）
  - name: demo1
    type: fullstack
    description: "Gene Expression Analysis - Full Stack Demo"
    routes:
      - path: /demo1/api
        target: localhost:28881
        type: api
        strip_prefix: true
      - path: /demo1
        target: localhost:28883
        type: frontend
        strip_prefix: true

  # Demo2 - 单体应用示例（生存分析）
  - name: demo2
    type: monolith
    description: "Survival Analysis - Monolithic Demo"
    routes:
      - path: /demo2
        target: localhost:28882
        type: full
        strip_prefix: true

  # UCSCXenaToolsPy - TCGA Analysis API (Python/FastAPI)
  - name: ucscxena
    type: custom
    description: "UCSCXenaToolsPy - TCGA Analysis API"
    start_script: start_api.sh
    env:
      API_PORT: 28885
    auto_update:
      enabled: true
      interval: hourly
      method: git_pull_install
      git_dir: ""
      venv_dir: venv
      reinstall_deps: true
    routes:
      - path: /ucscxena
        target: localhost:28885
        type: full
        strip_prefix: true

  # Shiny Server - 跳转到外部 Shiny Server
  - name: shiny
    type: redirect
    description: "Shiny Server (ZhouLab)"
    routes:
      - path: /shiny
        target: https://shiny.zhoulab.ac.cn/
        type: redirect

  # Shiny Portal - Docker Shiny Server 代理
  - name: shinyapps
    type: proxy
    description: "Shiny Portal (Docker Shiny Server)"
    routes:
      - path: /shinyapps
        target: localhost:3939
        type: full
        strip_prefix: true
